start_effect:
  target:
    entity:
      integration: lampster
      domain: light
  fields:
    effect:
      required: true
      selector:
        select:
          translation_key: effect
          options:
            - breathe
            - colorloop
            - random
            - candle
            - fireplace
            - spin_cw
            - spin_ccw
            - spin_alternating
            - fireworks
            - pursuit
    speed:
      selector:
        number:
          min: 25
          max: 200
          step: 5
          unit_of_measurement: "%"
          mode: slider
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    rgb_color:
      selector:
        color_rgb:

stop_effect:
  target:
    entity:
      integration: lampster
      domain: light
