<!doctype html>
<meta charset="utf-8">
<title>The Lampster card: styles and fasteners</title>
<style>
  body { margin: 0; padding: 16px; background: #120b19; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  #cards { display: flex; flex-wrap: wrap; gap: 12px 20px; }
  figure { margin: 0; } figcaption { margin-bottom: 4px; color: #aaa; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../custom_components/lampster/frontend/lampster-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  const brightness = [{ type: "light-brightness" }];
  // Every style, on a two-row card with the brightness slider
  const styles = ["none", "polished", "brushed", "rusted", "painted",
    ...["black", "blue", "gold", "green", "red", "white"].map((c) => `army_${c}`),
    ...["black", "gold", "green", "red", "white"].map((c) => `artsy_${c}`),
    ...["black", "blue", "gold", "green", "red"].map((c) => `color_${c}`)];
  for (const style of styles) addCard(style, { style, features: brightness, fasteners: { spacing: 8 }, pattern: 4242 });
  // Fasteners and spacing, including ends (E) on single-row cards
  for (const type of ["rivets", "phillips", "hex", "socket", "none"]) {
    addCard(`fasteners ${type}`, { style: "polished", fasteners: { type, spacing: 16 }, features: brightness });
  }
  for (const spacing of [0, 2, 4, 8, 16, 32, 64, "0E", "8E"]) {
    addCard(`single row, spacing ${spacing}`, { style: "rusted", fasteners: { spacing }, features: brightness, features_position: "inline" }, { height: 56 });
  }
  // Features styles on single-row and two-row cards
  for (const features_style of ["match", "flat", "console"]) {
    addCard(`single row, ${features_style}`, { style: "army_green", features_style, features: brightness, features_position: "inline" }, { height: 56 });
    addCard(`two rows, ${features_style}`, { style: "artsy_white", features_style, features: brightness });
  }
  // Fastener colors: match, a theme color and a CSS color
  for (const color of ["match", "amber", "#7a1f5c"]) {
    addCard(`fastener color ${color}`, { style: "color_blue", fasteners: { color }, features: brightness });
  }
  // Painted's paint, and head colors on any style (None needs one)
  addCard("painted, theme color", { style: "painted", paint_color: "teal", features: brightness });
  addCard("painted, own head color", { style: "painted", paint_color: "teal", head_color: "#7a1f5c", features: brightness });
  addCard("rusted, own head color", { style: "rusted", head_color: "#d4af37", features: brightness });
  addCard("none, head color", { style: "none", head_color: "#ff8800", features: brightness });
  runChecks({ head: { "painted, own head color": "#7a1f5c", "rusted, own head color": "#d4af37", "none, head color": "#ff8800" } });
</script>
