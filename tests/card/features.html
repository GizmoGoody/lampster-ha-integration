<!doctype html>
<meta charset="utf-8">
<title>The Lampster card: features</title>
<style>
  body { margin: 0; padding: 16px; background: #120b19; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  #cards { display: flex; flex-wrap: wrap; gap: 12px 20px; }
  figure { margin: 0; } figcaption { margin-bottom: 4px; color: #aaa; }
  .scaled { transform: scale(0.8); transform-origin: 0 0; }
  /* A theme with large card corners and pill-shaped features */
  .pill { --ha-card-border-radius: 34px; --ha-card-features-border-radius: 9999px; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../custom_components/lampster/frontend/lampster-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  // Every light feature: the first beside the name, the rest below (two groups)
  const all = ["light-brightness", "light-color-temp", "light-color-favorites", "light-effect", "toggle"].map((type) => ({ type }));
  const large = { features: all, features_position: "inline" };
  const size = { height: 230, width: 420 };
  for (const features_style of ["match", "flat", "inset"]) {
    addCard(`all features, ${features_style}`, { style: "artsy_red", features_style, fasteners: { spacing: 32 }, ...large }, size);
  }
  addCard("all features below, inset", { style: "polished", features_style: "inset", features: all }, { height: 320, width: 420 });
  addCard("pill theme, inset", { style: "polished", features_style: "inset", ...large }, { ...size, className: "pill" });
  addCard("scaled to 80% (editor preview), inset", { style: "rusted", features_style: "inset", ...large }, { ...size, className: "scaled" });
  addCard("scaled to 80%, pill theme, inset", { style: "color_gold", features_style: "inset", ...large }, { ...size, className: "scaled pill" });
  // The color favorite matching the light's color stays pressed; none when off
  addCard("pressed key", { style: "polished", features_style: "inset", ...large }, size);
  addCard("no pressed key when off", { style: "polished", features_style: "inset", ...large }, { ...size, hass: makeHass({}, "off") });
  runChecks({ pressed: { "pressed key": ["#3333ff"], "no pressed key when off": [] } });
</script>
