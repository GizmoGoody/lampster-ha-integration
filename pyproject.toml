[project]
name = "lampster-ha-integration"
version = "1.1.0"
description = "Home Assistant integration for The Lampster RGB Bluetooth lamp"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lampster"]

[tool.pytest.ini_options]
# Automated tests only; the other scripts in tests/ drive real hardware
testpaths = ["tests/automated"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
# The workflow lints the integration, its automated tests and the workflow
# scripts; the Phase 1 hardware scripts and standalone library are left as is

[tool.ruff.lint]
# Errors, unused code, import order, modern syntax and async mistakes
select = ["E4", "E7", "E9", "F", "I", "UP", "ASYNC"]
